name: mushaf
description: "Mushaf reader in the Warsh and Hafs riwayat."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  brotli: ^0.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/pages/
  fonts:
    - family: Hafs
      fonts:
        - asset: assets/fonts/hafs.ttf
    - family: Warsh
      fonts:
        - asset: assets/fonts/warsh.ttf
    - family: Qalon
      fonts:
        - asset: assets/fonts/qalon.ttf
    - family: Douri
      fonts:
        - asset: assets/fonts/douri.ttf
    - family: Shubah
      fonts:
        - asset: assets/fonts/shubah.ttf
