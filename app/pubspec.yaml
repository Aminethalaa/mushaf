name: mushaf
description: "Mushaf reader in the Warsh and Hafs riwayat."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
  fonts:
    - family: Hafs
      fonts:
        - asset: assets/fonts/hafs.ttf
    - family: Warsh
      fonts:
        - asset: assets/fonts/warsh.ttf
